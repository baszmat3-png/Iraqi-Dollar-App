name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.11.1 }
      - name: Restore signing key
        id: ks
        uses: actions/cache@v4
        with:
          path: release.keystore
          key: apk-signing-key-v1
      - name: Create signing key if missing
        run: |
          [ -f release.keystore ] || keytool -genkeypair -keystore release.keystore -storepass apkstore123 -keypass apkstore123 -alias app -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=App"
      - name: Build
        env:
          APP_URL: ${{ vars.APP_URL }}
          KS_PATH: ${{ github.workspace }}/release.keystore
          RUN_NUMBER: ${{ github.run_number }}
        run: gradle :app:assembleUserRelease :app:assembleAdminRelease :app:bundleUserRelease --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Publish error log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete buildlog --yes --cleanup-tag || true
          grep -nE "error|Error|FAILED|What went wrong|Could not|not found|Caused by" -A3 build.log | head -80 > err.txt || true
          gh release create buildlog --prerelease --title "Build log" --notes-file err.txt
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: |
            app/build/outputs/apk/*/release/*.apk
            app/build/outputs/bundle/userRelease/*.aab
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/user/release/*.apk app-release.apk
          cp app/build/outputs/apk/admin/release/*.apk admin-release.apk
          cp app/build/outputs/bundle/userRelease/*.aab app-release.aab
          gh release delete buildlog --yes --cleanup-tag || true
          gh release delete latest --yes --cleanup-tag || true
          SHA1=$(keytool -list -v -keystore release.keystore -storepass apkstore123 | grep "SHA1:" | head -1 | sed 's/.*SHA1: *//')
          gh release create latest app-release.apk admin-release.apk app-release.aab --title "Latest APK" --notes "Package: com.app.wrapper | SHA-1: $SHA1"
