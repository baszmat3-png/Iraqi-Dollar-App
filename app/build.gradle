plugins { id 'com.android.application' }
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
def appUrl = System.getenv("APP_URL") ?: "https://iraqi-dollar-drjx.onrender.com"
android {
    namespace 'com.app.wrapper'
    compileSdk 34
    
    defaultConfig {
        applicationId "com.app.wrapper"
        minSdk 24
        targetSdk 34
        versionCode (System.getenv("RUN_NUMBER") ?: "1").toInteger()
        versionName "1.0"
        buildConfigField "String", "APP_URL", "\"${appUrl}\""
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        stable {
            def ks = System.getenv("KS_PATH")
            if (ks) { storeFile file(ks); storePassword "apkstore123"; keyAlias "app"; keyPassword "apkstore123" }
        }
    }
    buildTypes {
        release {
            // موقّع بمفتاح debug ليُثبَّت مباشرة
            signingConfig System.getenv("KS_PATH") ? signingConfigs.stable : signingConfigs.debug
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
