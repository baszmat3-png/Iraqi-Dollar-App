plugins { id 'com.android.application' }
dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
def appUrl = System.getenv("APP_URL") ?: "https://iraqi-dollar-drjx.onrender.com"
android {
    namespace 'com.app.wrapper'
    compileSdk 36
    
    defaultConfig {
        applicationId "com.app.wrapper"
        minSdk 24
        targetSdk 36
        versionCode Integer.parseInt(System.getenv("RUN_NUMBER") ?: "1")
        versionName "1.0"
        buildConfigField "String", "APP_URL", "\"${appUrl}\""
    }
    flavorDimensions "v"
    productFlavors {
        user { dimension "v"; manifestPlaceholders = [appLabel: "التطبيق"]; buildConfigField "String", "START", "\"index.html\"" }
        admin { dimension "v"; applicationId "com.app.wrapper.admin"; manifestPlaceholders = [appLabel: "لوحة التحكم"]; buildConfigField "String", "START", "\"admin.html\"" }
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        stable {
            def ks = System.getenv("KS_PATH")
            if (ks) { storeFile file(ks); storePassword "apkstore123"; keyAlias "app"; keyPassword "apkstore123" }
        }
    }
    buildTypes {
        release {
            // موقّع بمفتاح debug ليُثبَّت مباشرة
            signingConfig System.getenv("KS_PATH") ? signingConfigs.stable : signingConfigs.debug
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
